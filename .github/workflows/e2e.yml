# WS-5: E2E trình duyệt (Playwright) — job riêng, tách khỏi ci.yml.
# Playwright tự bật engine (FastAPI) + web (next dev) qua webServer trong
# web/playwright.config.ts. Không secrets: engine chạy template + KB file.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

# Đẩy commit mới lên PR → huỷ lượt e2e cũ còn đang chạy (e2e ~12 phút, tiết kiệm phút Actions).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# SEC-2: quyền tối thiểu cho GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # khớp engine/Dockerfile + ci.yml
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Cài engine
        run: pip install -r engine/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cài iztro cho engine (an sao tử vi)
        run: npm ci --prefix engine/ziwei
      - name: Cài web
        working-directory: web
        run: npm ci
      - name: Cài Chromium cho Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Chạy E2E
        working-directory: web
        run: npm run e2e

      # CTA-2: khối thẻ cuối trang với CMS GIẢ (bài viết CMS, cấu hình "Lối đi tiếp", đo end_cta_*) — dùng lại bản build ở trên.
      - name: Chạy E2E có CMS giả
        working-directory: web
        run: npm run e2e:cms

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
            web/playwright-report-cms/
            web/test-results-cms/
          retention-days: 7

  # SAO-2 chuỗi THẬT: Supabase thu nhỏ (GoTrue + PostgREST tải bản phát hành ghim, Postgres service, migration thật của
  # dự án) — đăng nhập OTP qua thư, Sao chào mừng, trừ Sao, nạp qua cổng giả, lượt hỏi. Không giả lập route web nào.
  sao-that:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16  # Postgres 16 + pgvector (migration 0017, LG-ĐS)
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Cài engine
        run: pip install -r engine/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cài iztro cho engine
        run: npm ci --prefix engine/ziwei
      - name: Cài web
        working-directory: web
        run: npm ci
      - name: Cài Chromium cho Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Dựng Supabase thu nhỏ
        run: bash web/e2e-that/stack/len.sh
      - name: Đối chiếu mã kiểm chứng engine với hàm SQL thật (kiem_chung_ma_hop_le)
        working-directory: engine
        env:
          KIEM_CHUNG_PGDB: sb_thu
        run: python -m pytest -q tests/test_kiem_chung_ma.py
      - name: Chạy chuỗi Sao thật
        working-directory: web
        run: npm run e2e:that
      - name: Nhật ký Supabase thu nhỏ
        if: failure()
        run: tail -n 40 /tmp/sb-thu/*.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-sao-that
          path: |
            web/playwright-report-that/
            web/test-results-that/
          retention-days: 7
