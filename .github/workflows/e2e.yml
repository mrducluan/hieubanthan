# WS-5: E2E trình duyệt (Playwright) — job riêng, tách khỏi ci.yml.
# Playwright tự bật engine (FastAPI) + web (next dev) qua webServer trong
# web/playwright.config.ts. Không secrets: engine chạy template + KB file.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # khớp engine/Dockerfile + ci.yml
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Cài engine
        run: pip install -r engine/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cài iztro cho engine (an sao tử vi)
        run: npm ci --prefix engine/ziwei
      - name: Cài web
        working-directory: web
        run: npm ci
      - name: Cài Chromium cho Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Chạy E2E
        working-directory: web
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
