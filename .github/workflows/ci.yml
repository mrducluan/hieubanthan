# CI nền (WS-1): engine pytest + web typecheck/build trên PR + push vào main.
# (Trước chạy cả push nhánh lẫn PR → mỗi lần đẩy chạy 2 lần, tốn đôi phút GitHub Actions của repo private.)
# Tên job `engine` / `web` giữ cố định — WS-5 sẽ thêm job `e2e` phụ thuộc vào chúng.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      # SEO-L4: PR sửa KB từ /quan-tri (nhánh quan-tri/…) không chạy được lệnh cập nhật sổ ngày → chỉ kiểm khuôn sổ;
      # workflow so-ngay-quan-tri.yml tự chạy lệnh và đẩy commit sổ vào nhánh đó, nên main sau merge vẫn khớp.
      NGAY_CAP_NHAT_KIEM: ${{ startsWith(github.head_ref, 'quan-tri/') && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # khớp engine/Dockerfile
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      # iztro (an sao tử vi, SPEC-005) — engine gọi qua Node; ghim trong lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/ziwei/package-lock.json
      - run: npm ci --prefix engine/ziwei
      - name: pytest (gồm golden + drift Tuần/Triệt + golden an sao iztro)
        working-directory: engine
        run: python -m pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    env:
      # Giá trị giả vô hại — build không gọi engine, không cần secret thật.
      ENGINE_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Migration Supabase trên Postgres thật: lên 3 vòng → xuống → lên lại, rồi gọi thử hàm Sao / quản trị / thanh toán
  # như người dùng + service role (supabase/kiem_thu/chay.sh). Lỗi ngoài dòng "phải bị chặn" → job đỏ.
  supabase:
    name: supabase
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16  # Postgres 16 + pgvector (migration 0017, LG-ĐS)
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/kiem_thu/chay.sh
