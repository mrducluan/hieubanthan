# CI nền (WS-1): engine pytest + web typecheck/build trên PR + push vào main.
# (Trước chạy cả push nhánh lẫn PR → mỗi lần đẩy chạy 2 lần, tốn đôi phút GitHub Actions của repo private.)
# Tên job `engine` / `web` giữ cố định — WS-5 sẽ thêm job `e2e` phụ thuộc vào chúng.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      # SEO-L4: PR sửa KB từ /quan-tri (nhánh quan-tri/…) không chạy được lệnh cập nhật sổ ngày → chỉ kiểm khuôn sổ;
      # workflow so-ngay-quan-tri.yml tự chạy lệnh và đẩy commit sổ vào nhánh đó, nên main sau merge vẫn khớp.
      NGAY_CAP_NHAT_KIEM: ${{ startsWith(github.head_ref, 'quan-tri/') && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # khớp engine/Dockerfile
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      # iztro (an sao tử vi, SPEC-005) — engine gọi qua Node; ghim trong lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/ziwei/package-lock.json
      - run: npm ci --prefix engine/ziwei
      - name: pytest (gồm golden + drift Tuần/Triệt + golden an sao iztro)
        working-directory: engine
        run: python -m pytest -q

  # Sự cố 2026-11-02: pytest xanh nhưng ẢNH Docker thiếu ziwei/an_sao_lib.mjs → production mọi lượt an sao 503. Dựng
  # đúng ảnh Render dùng, chạy rồi gọi thử an sao + Thời gian tới (đường dùng tiến trình chạy sẵn).
  engine-docker:
    name: engine-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build ảnh engine (bước build tự chạy tuvi_an_sao.tu_kiem)
        run: docker build -t hbt-engine engine
      - name: chạy ảnh + gọi thử
        run: |
          docker run -d --name hbt -p 8000:8000 -e ENGINE_API_KEY=ci hbt-engine
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 1; done
          ls_so='{"birth_date":"1988-10-24","birth_time":"08:30","gender":"nam","noi_sinh":"ha-noi"}'
          curl -sf -X POST localhost:8000/v1/tuvi/an-sao -H 'x-engine-key: ci' -H 'content-type: application/json' \
            -d "$ls_so" -o /dev/null
          curl -sf -X POST localhost:8000/v1/thoi-gian-toi -H 'x-engine-key: ci' -H 'content-type: application/json' \
            -d "{\"ngay_sinh\":\"1988-10-24\",\"nam\":2027,\"la_so\":$ls_so}" -o /dev/null
      - if: failure()
        run: docker logs hbt || true

  web:
    name: web
    runs-on: ubuntu-latest
    env:
      # Giá trị giả vô hại — build không gọi engine, không cần secret thật.
      ENGINE_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Migration Supabase trên Postgres thật: lên 3 vòng → xuống → lên lại, rồi gọi thử hàm Sao / quản trị / thanh toán
  # như người dùng + service role (supabase/kiem_thu/chay.sh). Lỗi ngoài dòng "phải bị chặn" → job đỏ.
  supabase:
    name: supabase
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16  # Postgres 16 + pgvector (migration 0017, LG-ĐS)
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/kiem_thu/chay.sh
      # Sao lưu DB (workflow sao-luu-db): trọn vòng sao lưu mã hoá → khôi phục vào DB trống → số dòng từng bảng phải khớp.
      - run: bash supabase/sao-luu/thu-vong.sh
