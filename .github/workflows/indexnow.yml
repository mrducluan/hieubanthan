# Sau mỗi lần merge vào main: đợi Vercel deploy xong rồi báo IndexNow danh sách URL trong sitemap.
name: indexnow
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch: {}
jobs:
  bao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Đợi Vercel deploy
        run: sleep 240
      - name: Gửi IndexNow
        run: node web/scripts/indexnow.mjs https://hieuban.com
