# SEC-2: cảnh báo + PR nâng bản khi thư viện có lỗi bảo mật / bản mới. Mỗi PR vẫn qua CI + người duyệt
# (CLAUDE.md: đổi dependency cần chủ dự án duyệt — Dependabot chỉ ĐỀ XUẤT, không tự merge).
# Bật thêm trong GitHub → Settings → Code security: "Dependabot alerts" + "Dependabot security updates".
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      ban-va: { update-types: [patch] }
    ignore:
      - dependency-name: notfair-nextjs-blog   # tarball trong repo (BLOG-1), nâng tay
  - package-ecosystem: npm
    directory: /cms
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      payload: { patterns: ["payload", "@payloadcms/*"] }
      ban-va: { update-types: [patch] }
  - package-ecosystem: npm
    directory: /engine/ziwei
    schedule: { interval: monthly }
    ignore:
      - dependency-name: iztro   # ghim 2.6.0 — bản đã sinh golden (quyết định 2026-09-30)
  - package-ecosystem: pip
    directory: /engine
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
