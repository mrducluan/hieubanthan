# Blueprint Render — deploy engine từ Dockerfile bằng một cú bấm.
# Trên Render: New → Blueprint → trỏ tới repo GitHub này. Render đọc file này.
#
# ENGINE_API_KEY để sync=false → Render hỏi bạn nhập tay khi tạo (không lưu
# khoá bí mật trong git). Nhập CÙNG một chuỗi với biến ENGINE_API_KEY bên Vercel.
services:
  - type: web
    name: hieubanthan-engine-sg   # dịch vụ mới ở Singapore (dịch vụ cũ Oregon xoá sau khi chuyển)
    runtime: docker
    dockerfilePath: ./engine/Dockerfile
    dockerContext: ./engine
    # Hạ tầng GĐ1 (docs/KIEN-TRUC-VAN-HANH.md): Singapore — cạnh Vercel sin1 + Supabase SG; gói Starter không ngủ.
    # Vùng KHÔNG đổi được trên dịch vụ đã tạo → tạo dịch vụ mới theo docs/TRIEN-KHAI.md rồi trỏ ENGINE_URL sang.
    region: singapore
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENGINE_API_KEY
        sync: false           # nhập tay lúc tạo, không commit vào git
      - key: SENTRY_DSN
        sync: false           # tuỳ chọn — để trống = tắt giám sát lỗi
